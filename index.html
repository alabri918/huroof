:root{--font:"Kufi",system-ui,"Segoe UI",Tahoma,sans-serif;--gold:#f6c445;--ink:#3b250f;
  --tile1:#fff7e2;--tile2:#efd39b;--edge:#b07b34;--panel:rgba(4,14,58,.55);--line:rgba(160,190,255,.22);--muted:#b4c3f2;--red:#ff6161;--green:#5fe08b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#062aa0 url(img/background.webp) center/cover no-repeat fixed;color:#fff;font-family:var(--font);font-weight:700;
  user-select:none;-webkit-user-select:none;min-height:100dvh}
button,input{font-family:inherit;font-weight:700}
button{cursor:pointer;border:0;color:inherit}
input{user-select:text;-webkit-user-select:text}
#app{min-height:100dvh}
.primary{background:linear-gradient(180deg,#ffd862,#f0ad22);color:#3a2300;border-radius:16px;padding:.7em 1.4em;font-size:1.15rem;font-weight:800;box-shadow:0 5px 0 #a8700e}
.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #a8700e}
.primary.big{width:100%;font-size:1.4rem;padding:.75em}
.primary:disabled{filter:grayscale(1);opacity:.5}
.ghost{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:12px;padding:.55em 1em;font-size:.95rem}
.ghost:active{background:rgba(255,255,255,.2)}
.ghost.danger{color:#ffb3b3;border-color:rgba(255,97,97,.4)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.inp{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;color:#fff;padding:.6em .8em;font-size:1rem;outline:none}
.inp:focus{border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}
h2{font-size:1.05rem;color:var(--muted);margin:18px 0 10px;font-weight:700}
h2:first-child{margin-top:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:999px;padding:.3em .9em;font-size:.95rem;white-space:nowrap}
.pill b{color:var(--gold);letter-spacing:.08em}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.brand{font-weight:800;font-size:3.4rem;line-height:1;color:var(--gold);text-shadow:0 4px 0 #8a5a0a,0 10px 30px rgba(246,196,69,.25)}
.muted{color:var(--muted)}

/* ---------- letters board ---------- */
.board{display:grid;grid-template-columns:repeat(var(--cols,7),1fr);gap:var(--gap,10px);margin:0 auto;width:100%}
.tile{position:relative;aspect-ratio:1;border-radius:18%;background:linear-gradient(180deg,var(--tile1),var(--tile2));
  box-shadow:0 5px 0 var(--edge),0 9px 16px rgba(0,0,0,.35);color:var(--ink);padding:0;container-type:size;
  display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .35s,filter .35s,box-shadow .2s}
.tile .ch{font-weight:800;font-size:58cqh;line-height:1;margin-top:-6%}
.tile small{position:absolute;inset:auto 4% 5% 4%;font-size:15cqh;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#21140a}
.tile.used{opacity:.3;filter:saturate(.25);transform:translateY(4px);box-shadow:0 1px 0 var(--edge),inset 0 0 0 4px var(--c)}
.tile.used .ch{margin-top:-22%}
.tile.just{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(1.25);opacity:1;filter:none}100%{}}
.board.live .tile:not(.used):hover{transform:translateY(-3px)}
.board.live .tile:not(.used):active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.board.idle .tile:not(.used){filter:brightness(.78)}
.board.host .tile.used{cursor:pointer}

/* ---------- turn + clock ---------- */
.turnbox{display:flex;align-items:center;justify-content:center;gap:18px;min-height:70px}
.who{display:flex;align-items:center;gap:10px;font-size:1.7rem;font-weight:800}
.who b{color:var(--c)}
.clock{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:800;
  background:rgba(0,0,0,.35);border:3px solid var(--gold);font-variant-numeric:tabular-nums}
body.hot .clock{border-color:var(--red);color:var(--red);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.tbar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px auto 16px;width:100%}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd862,#f0ad22);transform-origin:right;border-radius:9px}
body.hot .tbar i{background:var(--red)}
.paused{font-size:1.5rem;color:var(--muted)}
.last{text-align:center;color:var(--muted);min-height:1.6em;margin-top:16px;font-size:1.05rem}
.last.out{color:#ffb0b0}

/* ---------- players list ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 12px;transition:.25s}
.pl .nm{flex:1 1 auto;min-width:3.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.08rem}
.pl .tag{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.pl .sc{font-size:1.25rem;color:var(--gold);min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.pl.turn{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:0 0 0 2px var(--c)}
.pl.out{opacity:.45}
.pl.out .nm{text-decoration:line-through}
.pl.off .dot{background:#666}
.acts{display:flex;gap:5px}
.acts button{font-size:.78rem;padding:.35em .6em;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.acts .x{color:#ffb3b3}
.empty{color:var(--muted);text-align:center;padding:14px;border:1px dashed var(--line);border-radius:14px}

/* ---------- host ---------- */
.lobby{display:grid;grid-template-columns:minmax(280px,420px) minmax(300px,520px);gap:24px;justify-content:center;align-items:start;padding:28px 18px}
.joincard{text-align:center}
.qr{background:#fff;border-radius:18px;padding:8px;width:min(100%,300px);margin:18px auto 14px}
.qr svg{display:block;width:100%;height:auto}
.code{font-size:1.1rem;color:var(--muted)}
.code b{display:block;font-size:3rem;color:#fff;letter-spacing:.25em;margin-top:2px;direction:ltr}
.link{direction:ltr;font-size:.8rem;color:var(--muted);word-break:break-all;margin-top:8px;user-select:text;-webkit-user-select:text}
.net{margin-top:10px;font-size:.85rem}
.net.ok{color:var(--green)}
.net.bad{color:var(--red)}
.qtext{font-size:1.8rem;font-weight:800;color:var(--gold);background:rgba(0,0,0,.25);border-radius:14px;padding:.4em .6em;margin-bottom:10px;text-align:center}
.qtools{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.rules{color:var(--muted);font-size:.85rem;line-height:1.9;margin:16px 0 0}

.play{display:grid;grid-template-columns:1fr 330px;gap:22px;padding:18px 22px;min-height:100dvh}
.stage{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q{margin:0;font-size:clamp(2rem,4.5vw,3.6rem);font-weight:800;color:var(--gold);text-align:center;flex:1;line-height:1.25;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.play .board{--cols:7;--gap:clamp(8px,1.2vw,16px);width:min(100%,calc((100dvh - 300px) * 1.75))}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .plist{flex:1;overflow:auto}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controls .wide{grid-column:1/-1}

.endwrap{max-width:640px;margin:0 auto;padding:28px 18px;display:flex;flex-direction:column;gap:16px}
.winner{text-align:center;padding:26px 16px}
.winner .lbl{color:var(--muted);font-size:1.1rem}
.winner .nm{font-size:3rem;font-weight:800;color:var(--c,var(--gold));margin:6px 0}
.stand .pl .rank{width:1.6em;text-align:center;color:var(--muted)}
.stand .pl .w{font-size:.8rem;color:var(--muted);white-space:nowrap}

/* ---------- landing / player ---------- */
.center{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.center .card{width:min(100%,400px);display:flex;flex-direction:column;gap:12px}
.center p{margin:0;line-height:1.9}
.or{color:var(--muted)}
.codein{text-align:center;letter-spacing:.3em;font-size:1.5rem;direction:ltr;text-transform:uppercase}

.pwrap{max-width:560px;margin:0 auto;padding:12px 12px calc(14px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:8px;font-size:1.05rem;min-width:0}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq{text-align:center;font-size:clamp(1.6rem,8vw,2.4rem);font-weight:800;color:var(--gold);margin:12px 0 4px;line-height:1.3}
.pturn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px}
.pturn .who{font-size:1.25rem}
.pturn .clock{width:56px;height:56px;font-size:1.6rem}
.pturn.mine .who{font-size:1.7rem;color:var(--gold)}
.pturn.mine .clock{width:66px;height:66px;font-size:2rem}
.pwrap .board{--cols:5;--gap:9px;width:min(100%,calc((100dvh - 270px) * .83))}
.pwrap .tbar{margin:6px 0 14px}
.banner{text-align:center;padding:12px;border-radius:14px;background:rgba(255,97,97,.14);border:1px solid rgba(255,97,97,.35);color:#ffc2c2;margin-bottom:10px}
.conn{position:fixed;top:0;inset-inline:0;background:#b3261e;color:#fff;text-align:center;font-size:.85rem;padding:6px;z-index:5}

.modal{position:fixed;inset:0;background:rgba(5,4,16,.7);display:grid;place-items:center;z-index:20;padding:20px}
.mbox{background:#0a1f6e;border:1px solid var(--line);border-radius:20px;padding:22px;width:min(100%,380px);text-align:center}
.mbox p{font-size:1.15rem;margin:0 0 18px;line-height:1.8}
.mbox .row{justify-content:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d2a8c;border:1px solid var(--line);padding:.7em 1.2em;border-radius:14px;z-index:30;animation:fade 2.6s forwards}
@keyframes fade{0%,85%{opacity:1}100%{opacity:0}}

/* ---------- tournament (cup) ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.28);padding:5px;border-radius:14px}
.seg button{padding:.6em;border-radius:10px;background:transparent;color:var(--muted);font-size:1rem}
.seg button.on{background:var(--gold);color:#3a2300}
.cupinfo{color:var(--muted);font-size:.9rem;margin-top:8px;text-align:center;line-height:1.8}
.cupinfo b{color:#fff}
.cupwrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 12px}
.bracket{position:relative;width:min(100%,calc((100dvh - 150px) * var(--ar)));aspect-ratio:var(--ar);margin:0 auto;overflow:hidden}
.bstage{position:absolute;top:0;height:100%;container-type:inline-size}
.bracket .lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slot{position:absolute;transform:translate(-50%,-50%);background:center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.45cqw;font-weight:800;padding:0 .7cqw;transition:opacity .3s}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.empty{color:rgba(180,195,242,.45)}
.slot.empty span{font-size:.72em}
.slot.lost{opacity:.42}
.slot.lost span{text-decoration:line-through}
.slot.won span{color:var(--gold)}
.slot.live{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 .9cqw #ffd862) brightness(1.25)}}
.slot.champ{color:#3a2300;font-size:1.9cqw}
.collbl{position:absolute;transform:translate(-50%,-50%);font-size:1.05cqw;color:var(--muted);white-space:nowrap}
.bracket .tro{position:absolute;left:50%;top:18%;height:40%;transform:translateX(-50%);filter:drop-shadow(0 0 2cqw rgba(255,200,80,.35))}
.cupbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.nextm{font-size:1.35rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.nextm b{color:var(--c)}
.nextm .vs{color:var(--muted);font-size:1rem}
.champwrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.champwrap .tro{height:min(46dvh,420px);filter:drop-shadow(0 0 40px rgba(255,200,80,.45));animation:rise .9s ease-out}
@keyframes rise{from{transform:translateY(30px) scale(.85);opacity:0}}
.plate{width:min(92vw,520px);aspect-ratio:286/56;background:url(img/winner.webp) center/100% 100% no-repeat;display:grid;place-items:center;
  color:#3a2300;font-size:clamp(1.4rem,4.8vw,2.4rem);font-weight:800;padding:0 4%}
.plate span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mlist .rlbl{color:var(--muted);margin:14px 0 6px;font-size:.9rem}
.mlist .m{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:6px}
.mlist .m > span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mlist .m .vs{flex:none;color:var(--muted);font-size:.8rem}
.mlist .m .w{color:var(--gold)}
.mlist .m .l{opacity:.45;text-decoration:line-through}
.mlist .m.live{box-shadow:0 0 0 2px var(--gold)}
.mlist .m.me{background:rgba(246,196,69,.12)}
.banner.watch{background:rgba(80,140,255,.15);border-color:rgba(120,170,255,.4);color:#d6e3ff}
.banner.watch .ghost{padding:.35em .9em;font-size:.9rem;flex:none}
.livecard{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 12px;text-align:center}
.pbr{cursor:zoom-in;margin-top:4px}
.pbr .slot{font-size:2.1cqw;padding:0 .4cqw}
.pbr .collbl{font-size:1.9cqw}
.bigbr{position:fixed;inset:0;z-index:40;background:#05165c url(img/background.webp) center/cover;display:grid;place-items:center;overflow:hidden}
.bigbr .bracket{width:min(96vw,calc(96dvh * var(--ar)))}
.bigbr .slot{font-size:1.8cqw}
.bigin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.closebr{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:41}
@media (orientation:portrait){ .bigbr.rot .bracket{width:min(94dvh,calc(94vw * var(--ar)));transform:rotate(90deg)} }

@media (max-width:900px){
  .lobby{grid-template-columns:1fr}
  .play{grid-template-columns:1fr;padding:12px}
  .play .board{--cols:5;width:100%}
  .who{font-size:1.3rem}
}

<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ---------- QR code encoder (byte mode, error level L or M), works offline ---------- */
const QR = (() => {
  const T = {
    L:{f:1, e:[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
            b:[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25]},
    M:{f:0, e:[10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
            b:[1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]}
  };
  const bit = (x, i) => ((x >>> i) & 1) !== 0;
  const rawModules = v => { let r = (16*v + 128)*v + 64; if(v >= 2){ const n = Math.floor(v/7) + 2; r -= (25*n - 10)*n - 55; if(v >= 7) r -= 36; } return r; };
  const dataCw = (v, t) => Math.floor(rawModules(v)/8) - t.e[v-1]*t.b[v-1];
  const mul = (x, y) => { let z = 0; for(let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  function divisor(d){ const r = Array(d).fill(0); r[d-1] = 1; let root = 1;
    for(let i = 0; i < d; i++){ for(let j = 0; j < d; j++){ r[j] = mul(r[j], root); if(j + 1 < d) r[j] ^= r[j+1]; } root = mul(root, 2); }
    return r; }
  function remainder(data, div){ const r = div.map(() => 0);
    for(const b of data){ const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); }
    return r; }

  function encode(text, level = "L"){
    const t = T[level], bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for(; v <= 40; v++) if(4 + (v < 10 ? 8 : 16) + bytes.length*8 <= dataCw(v, t)*8) break;
    if(v > 40) throw new Error("too long");
    const cap = dataCw(v, t)*8, bits = [];
    const put = (val, n) => { for(let i = n-1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
    for(let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = []; for(let i = 0; i < bits.length; i += 8){ let x = 0; for(let j = 0; j < 8; j++) x = (x << 1) | bits[i+j]; data.push(x); }

    // error correction + interleave
    const nb = t.b[v-1], ecl = t.e[v-1], raw = Math.floor(rawModules(v)/8), nShort = nb - raw % nb, shortLen = Math.floor(raw/nb), div = divisor(ecl), blocks = [];
    for(let i = 0, k = 0; i < nb; i++){
      const d = data.slice(k, k + shortLen - ecl + (i < nShort ? 0 : 1)); k += d.length;
      const e = remainder(d, div); if(i < nShort) d.push(0); blocks.push(d.concat(e));
    }
    const all = [];
    for(let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if(i !== shortLen - ecl || j >= nShort) all.push(b[i]); });

    // function patterns
    const n = v*4 + 17, M = [...Array(n)].map(() => Array(n).fill(false)), F = [...Array(n)].map(() => Array(n).fill(false));
    const setF = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for(let i = 0; i < n; i++){ setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    for(const [cx, cy] of [[3,3],[n-4,3],[3,n-4]])
      for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++){
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if(x >= 0 && x < n && y >= 0 && y < n) setF(x, y, d !== 2 && d !== 4);
      }
    if(v > 1){
      const na = Math.floor(v/7) + 2, step = v === 32 ? 26 : Math.ceil((v*4 + 4)/(na*2 - 2))*2, pos = [6];
      for(let p = n - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      pos.forEach((a, i) => pos.forEach((b, j) => {
        if((i === 0 && j === 0) || (i === 0 && j === na-1) || (i === na-1 && j === 0)) return;
        for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++) setF(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }));
    }
    const drawFormat = mask => {
      const d = t.f << 3 | mask; let r = d; for(let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = (d << 10 | r) ^ 0x5412;
      for(let i = 0; i <= 5; i++) setF(8, i, bit(b, i));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for(let i = 9; i < 15; i++) setF(14 - i, 8, bit(b, i));
      for(let i = 0; i < 8; i++) setF(n - 1 - i, 8, bit(b, i));
      for(let i = 8; i < 15; i++) setF(8, n - 15 + i, bit(b, i));
      setF(8, n - 8, true);
    };
    drawFormat(0);
    if(v >= 7){
      let r = v; for(let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = v << 12 | r;
      for(let i = 0; i < 18; i++){ const a = n - 11 + i % 3, c = Math.floor(i/3); setF(a, c, bit(b, i)); setF(c, a, bit(b, i)); }
    }
    // data
    let k = 0;
    for(let right = n - 1; right >= 1; right -= 2){
      if(right === 6) right = 5;
      for(let vert = 0; vert < n; vert++) for(let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? n - 1 - vert : vert;
        if(!F[y][x] && k < all.length*8){ M[y][x] = bit(all[k >>> 3], 7 - (k & 7)); k++; }
      }
    }
    // pick the mask with the lowest penalty
    const cond = [(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply = m => { for(let y = 0; y < n; y++) for(let x = 0; x < n; x++) if(!F[y][x] && cond[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for(let a = 0; a < n; a++){
        let rr = 1, rc = 1;
        for(let b = 1; b < n; b++){
          if(M[a][b] === M[a][b-1]){ rr++; if(rr === 5) p += 3; else if(rr > 5) p++; } else rr = 1;
          if(M[b][a] === M[b-1][a]){ rc++; if(rc === 5) p += 3; else if(rc > 5) p++; } else rc = 1;
        }
      }
      for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
        if(M[y][x]) dark++;
        if(x < n-1 && y < n-1 && M[y][x] === M[y][x+1] && M[y][x] === M[y+1][x] && M[y][x] === M[y+1][x+1]) p += 3;
      }
      return p + Math.floor(Math.abs(dark*20 - n*n*10)/(n*n))*10;
    };
    let best = 0, bestP = Infinity;
    for(let m = 0; m < 8; m++){ apply(m); drawFormat(m); const p = penalty(); if(p < bestP){ bestP = p; best = m; } apply(m); }
    apply(best); drawFormat(best);
    return M;
  }

  // SVG with a 4-module quiet zone
  function svg(text, level){
    const M = encode(text, level), n = M.length; let d = "";

/* ---------- tournament: a knockout bracket sized to the number of players ----------
   cup.rounds[r] is a list of matches {a, b, w, done}; match i of round r feeds slot a/b of match i>>1 in round r+1.
   A bracket of 2/4/8/16 slots is picked from the player count; the missing slots are byes (straight through). */
const CUP_MAX = 16;
const stageName = slots => ({2:"النهائي", 4:"نصف النهائي", 8:"ربع النهائي", 16:"دور الـ16"})[slots] || "";

function cupPreview(n){
  if(n < 2) return "البطولة تحتاج لاعبين على الأقل";
  if(n > CUP_MAX) return `البطولة لحد ${CUP_MAX} لاعب، وعندك ${n}`;
  const B = cupSize(n), byes = B - n;
  return `<b>${n}</b> لاعبين، والبطولة تبدأ من <b>${stageName(B)}</b>${byes ? `، و<b>${byes}</b> يتأهلون مباشرة للدور الثاني` : ""}`;
}
function buildCup(){
  const ids = S.players.map(p => p.id);
  for(let i = ids.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const B = cupSize(ids.length), pairs = B / 2, byes = B - ids.length;
  // hand the byes out alternately to the two halves of the bracket
  const order = pairs === 1 ? [0] : Array.from({length:pairs / 2}, (_, k) => [k, pairs / 2 + k]).flat();
  const byePairs = new Set(order.slice(0, byes));
  const rounds = [Array.from({length:pairs}, (_, m) => ({a:ids.pop(), b:byePairs.has(m) ? null : ids.pop(), w:null, done:false}))];
  for(let len = pairs / 2; len >= 1; len /= 2) rounds.push(Array.from({length:len}, () => ({a:null, b:null, w:null, done:false})));
  const names = {}; S.players.forEach(p => names[p.id] = {name:p.name, color:p.color});
  S.cup = {size:B, rounds, names, out:[]};
  resolveCup();
}
// fills later rounds from decided matches and settles matches that cannot be played (bye, or opponent removed)
function resolveCup(){
  const R = S.cup.rounds, out = new Set(S.cup.out);
  R.forEach((round, r) => round.forEach((m, i) => {
    if(r > 0){ const f1 = R[r-1][2*i], f2 = R[r-1][2*i+1]; m.a = f1.done ? f1.w : null; m.b = f2.done ? f2.w : null; if(!f1.done || !f2.done) return; }
    if(m.done) return;
    const live = [m.a, m.b].filter(id => id && !out.has(id));
    if(live.length < 2){ m.done = true; m.w = live[0] || null; }
  }));
}
function nextMatchOf(cup){
  if(!cup) return null;
  for(let r = 0; r < cup.rounds.length; r++)
    for(let i = 0; i < cup.rounds[r].length; i++){ const m = cup.rounds[r][i]; if(!m.done && m.a && m.b) return {r, i, a:m.a, b:m.b, label:stageName(cup.size >> r)}; }
  return null;
}
const cupOver = cup => !!cup && cup.rounds[cup.rounds.length - 1][0].done;

function hostStart(){
  let saved = null; try{ saved = JSON.parse(localStorage.getItem("huroof_host") || "null"); }catch(e){}
  if(saved && saved.S && Date.now() - saved.at < 12 * 3600e3){
    S = {...freshState(), ...saved.S}; code = saved.code;
    S.players.forEach(p => { if(!p.local) p.connected = false; });
    if(S.phase === "play"){ S.remaining = Math.max(1000, S.remaining || TURN_MS); S.paused = true; }
  } else { S = freshState(); code = newCode(); }
  usedQ = new Set(S.usedQ || []);

function save(){ S.usedQ = [...usedQ]; try{ localStorage.setItem("huroof_host", JSON.stringify({at:Date.now(), code, S:{...S, remaining:remainingNow()}})); }catch(e){} }

let peerTries = 0;
function startPeer(){
  if(typeof Peer === "undefined"){ netState = "nolib"; renderNet(); return; }
  try{ peer && peer.destroy(); }catch(e){}
  netState = "connecting"; renderNet();
  const me = new Peer(PEER_PREFIX + code, PEER_CFG); peer = me;
  me.on("open", () => { peerTries = 0; netState = "online"; renderNet(); });
  me.on("connection", conn => {
    conn.on("data", d => hostMsg(conn, d));
    conn.on("close", () => dropConn(conn));
    conn.on("error", () => dropConn(conn));
  });
  me.on("disconnected", () => { if(me !== peer) return; netState = "connecting"; renderNet(); setTimeout(() => { if(me === peer && me.disconnected && !me.destroyed) me.reconnect(); }, 1500); });
  me.on("error", e => {
    if(me !== peer) return;
    if(e.type === "unavailable-id"){
      // after a page refresh the old id can stay taken for a few seconds
      if(++peerTries < 6) setTimeout(startPeer, 2500);
      else { code = newCode(); peerTries = 0; save(); layout = ""; renderHost(); startPeer(); }
    } else if(["network","server-error","socket-error","socket-closed"].includes(e.type)){
      netState = "offline"; renderNet(); setTimeout(() => { if(me === peer && (me.destroyed || me.disconnected || !me.open)) startPeer(); }, 3000);
    }
  });
}
function hostMsg(conn, d){
  if(!d || typeof d !== "object") return;
  if(d.t === "join"){
    const pid = String(d.pid || "").slice(0, 40); if(!pid) return;
    let p = byId(pid);
    if(!p){ p = newPlayer(pid, uniqueName(String(d.name || "").trim().slice(0, 16) || "لاعب"), false); S.players.push(p); }
    p.connected = true;
    const old = conns.get(pid); conns.set(pid, conn); conn.pid = pid;
    if(old && old !== conn) try{ old.close(); }catch(e){}
    changed();
  } else if(d.t === "pick" && conn.pid && conns.get(conn.pid) === conn) pick(conn.pid, d.l);
}
function dropConn(conn){
  if(!conn.pid || conns.get(conn.pid) !== conn) return;
  conns.delete(conn.pid);
  const p = byId(conn.pid); if(p){ p.connected = false; changed(); }
}
function snapshot(){ return {phase:S.phase, mode:S.mode, cup:S.cup, match:S.match, round:S.round, question:S.question, players:S.players, turn:S.turn, letters:S.letters, paused:S.paused, remaining:remainingNow(), result:S.result, last:S.last}; }
function broadcast(){ const msg = {t:"state", s:snapshot()}; conns.forEach(c => { if(c.open) try{ c.send(msg); }catch(e){} }); }

/* ---------- rules ---------- */
function startRound(){
  let ids;
  if(S.mode === "cup"){
    const nm = nextMatchOf(S.cup); if(!nm) return;
    S.match = nm; ids = [nm.a, nm.b];
  } else {
    if(S.players.length < 2){ toast("لازم لاعبين على الأقل"); return; }
    S.match = null; ids = S.players.map(p => p.id);
  }
  S.round++; S.phase = "play"; S.letters = {}; S.result = null; S.paused = false;
  S.players.forEach(p => p.alive = ids.includes(p.id));
  S.turn = S.match ? ids[Math.random() < .5 ? 0 : 1] : S.players[(S.round - 1) % S.players.length].id;
  deadline = Date.now() + TURN_MS; usedQ.add(S.question);
  S.last = {txt: S.match ? `${S.match.label}: ${byId(ids[0]).name} ضد ${byId(ids[1]).name}، أول دور على ${byId(S.turn).name}`
                         : `بدأت الجولة ${S.round}، أول دور على ${byId(S.turn).name}`};
  sfx.turn(); changed();
}
function pick(pid, l){
  if(S.phase !== "play" || S.paused || S.turn !== pid || !LETTERS.includes(l) || S.letters[l]) return;
  const p = byId(pid);
  S.letters[l] = {id:p.id, name:p.name, color:p.color}; p.score++;
  S.last = {txt:`${p.name} أخذ حرف ${l}`}; justLetter = l;
  sfx.pick(); advanceFrom(S.players.indexOf(p));
}
function advanceFrom(i){
  const alive = S.players.filter(p => p.alive);
  if(alive.length <= 1) return endRound(alive, "last");
  if(Object.keys(S.letters).length >= LETTERS.length) return endRound(alive, "letters");
  const n = S.players.length;
  for(let k = 1; k <= n; k++){ const q = S.players[((i + k) % n + n) % n]; if(q.alive){ S.turn = q.id; break; } }
  deadline = Date.now() + TURN_MS; S.remaining = TURN_MS;
  changed();
}
function knockOut(p, txt){
  p.alive = false; S.last = {txt, out:true}; sfx.out();
  if(S.turn === p.id) advanceFrom(S.players.indexOf(p));
  else if(S.players.filter(q => q.alive).length <= 1) endRound(S.players.filter(q => q.alive), "last");
  else changed();
}
function endRound(winners, reason){
  S.turn = null; S.paused = false;
  if(S.mode === "cup" && S.match && S.cup){
    // a cup match needs exactly one winner; if all letters ran out, whoever took more letters wins, a tie is replayed
    let w = winners.length === 1 ? winners[0] : null;
    if(!w && reason === "letters" && winners.length === 2){
      const cnt = id => Object.values(S.letters).filter(u => u.id === id).length, [x, y] = winners;
      if(cnt(x.id) !== cnt(y.id)) w = cnt(x.id) > cnt(y.id) ? x : y;
    }
    const m = S.cup.rounds[S.match.r][S.match.i];
    if(w){ w.score += WIN_BONUS; w.wins++; m.w = w.id; m.done = true; resolveCup(); sfx.win(); }
    S.result = {winners:w ? [w.id] : [], reason, round:S.round, match:S.match, replay:!w};
    S.match = null; S.phase = cupOver(S.cup) ? "champion" : "bracket"; viewBracket = false;
    S.question = randomQ(); S.players.forEach(p => p.alive = true);
    return changed();
  }
  S.phase = "end";
  winners.forEach(p => { p.score += WIN_BONUS; p.wins++; });
  S.result = {winners:winners.map(p => p.id), reason, round:S.round};
  S.question = randomQ();
  if(winners.length) sfx.win();
  changed();
}
function hostTick(){
  if(S.phase === "play" && !S.paused && S.turn && Date.now() >= deadline){
    const p = byId(S.turn); if(p) knockOut(p, `خلص وقت ${p.name} وطلع من الجولة`);
  }
}
const inMatch = id => !S.match || S.match.a === id || S.match.b === id;

/* ---------- host actions ---------- */
let viewBracket = false;

  const id = el.dataset.id, p = id && byId(id);

        const u = S.letters[l];

    case "kick": if(p && S.phase === "play" && p.alive) knockOut(p, `الهوست أقصى ${p.name} من الجولة`); break;
    case "revive": if(p && S.phase === "play" && !p.alive && inMatch(p.id)){ p.alive = true; S.last = {txt:`${p.name} رجع للجولة`}; changed(); } break;

let P = {code:"", pid:"", name:"", conn:null, peer:null, s:null, view:"join", kicked:false, pending:null, retry:null, connected:false, hostMissing:false};

function playerStart(c){
  P.code = c;

  P.pid = sessionStorage.getItem("huroof_pid") || ("p" + rid(12)); sessionStorage.setItem("huroof_pid", P.pid);

function pConnect(){
  if(typeof Peer === "undefined"){ P.view = "error"; P.err = "ما قدرنا نحمّل مكتبة الاتصال، تأكد من الإنترنت."; return renderPlayer(); }
  clearTimeout(P.retry);
  if(!P.peer || P.peer.destroyed){
    P.peer = new Peer(undefined, PEER_CFG);
    P.peer.on("open", openConn);
    P.peer.on("disconnected", () => { setTimeout(() => { if(P.peer && P.peer.disconnected && !P.peer.destroyed) P.peer.reconnect(); }, 1200); });
    P.peer.on("error", e => {
      if(e.type === "peer-unavailable"){ P.hostMissing = true; renderPlayer(); }
      scheduleRetry();
    });

}
function openConn(){
  if(P.kicked) return;

  c.on("open", () => { if(c !== P.conn) return; P.connected = true; P.hostMissing = false; c.send({t:"join", pid:P.pid, name:P.name}); renderPlayer(); });
  c.on("data", d => { if(c === P.conn) playerMsg(d); });
  c.on("close", () => { if(c !== P.conn) return; P.connected = false; renderPlayer(); scheduleRetry(); });
  c.on("error", () => { if(c !== P.conn) return; P.connected = false; scheduleRetry(); });
  setTimeout(() => { if(c === P.conn && !c.open) scheduleRetry(); }, 8000);
}
function scheduleRetry(){ if(P.kicked) return; clearTimeout(P.retry); P.retry = setTimeout(pConnect, 2500); }

function playerMsg(d){
  if(!d || typeof d !== "object") return;
  if(d.t === "kicked"){ P.kicked = true; P.view = "kicked"; clearTimeout(P.retry); try{ P.peer.destroy(); }catch(e){} return renderPlayer(); }

  if(prev && s.phase !== "play" && prev.phase === "play" && s.result && s.result.winners.includes(P.pid)) sfx.win();
  if(prev && s.phase === "play" && prev.phase === "play"){
    const me = s.players.find(p => p.id === P.pid), pm = prev.players.find(p => p.id === P.pid);

        ? `<div class="lbl">${w.some(p => p.id === P.pid) ? "مبروك! فزت بالجولة" : "فاز بالجولة"}</div><div class="nm" style="--c:${w[0].color}">${w.map(p => esc(p.name)).join(" و ")}</div>`
        : `<div class="lbl">انتهت الجولة</div><div class="nm">بدون فائز</div>`}</section>
      <section class="card" style="margin-top:12px"><h2>الترتيب</h2><div class="plist stand">${standings(s.players, false)}</div></section>
      <p class="muted" style="text-align:center">انتظر الهوست يبدأ الجولة التالية</p></div>`;
    return;
  }
  // in a cup, players who are not in the running match stay on the bracket until they tap «مشاهدة»
  const spectator = v === "play" && s.mode === "cup" && s.match && s.match.a !== P.pid && s.match.b !== P.pid;
  if(v === "bracket" || v === "champion" || (spectator && !P.watching)){
    pLayout = "cup";
    const cup = s.cup, nm = nextMatchOf(cup), nmOf = id => cup.names[id], fin = cup.rounds[cup.rounds.length - 1][0];
    const iLost = cup.rounds.some(r => r.some(m => m.done && m.w !== P.pid && (m.a === P.pid || m.b === P.pid)));
    let status;
    if(v === "champion") status = fin.w === P.pid ? "مبروك! أنت بطل حروف" : "انتهت البطولة";
    else if(spectator) status = iLost ? "خرجت من البطولة، تقدر تتفرج على المباريات" : !cup.names[P.pid] ? "دخلت بعد بداية البطولة، تقدر تتفرج" : "مو دورك الحين، تقدر تتفرج";
    else if(nm && (nm.a === P.pid || nm.b === P.pid)) status = `مباراتك الجاية (${nm.label}) ضد ${esc(nmOf(nm.a === P.pid ? nm.b : nm.a).name)}`;
    else if(iLost) status = "خرجت من البطولة، تابع المباريات";
    else if(!cup.names[P.pid]) status = "دخلت بعد بداية البطولة، تتفرج على المباريات";
    else status = "انتظر مباراتك الجاية";
    const side = (m, id) => id ? `<span class="${m.done ? (m.w === id ? "w" : "l") : ""}">${esc(nmOf(id).name)}</span>` : `<span class="muted">؟</span>`;
    const list = cup.rounds.map((round, k) => {
      const rows = round.map((m, i) => {
        if(k === 0 && !m.b) return `<div class="m${m.a === P.pid ? " me" : ""}"><span class="w">${esc(nmOf(m.a).name)}</span><span class="vs">تأهل مباشرة</span></div>`;
        const isLive = nm && nm.r === k && nm.i === i, mine = m.a === P.pid || m.b === P.pid;
        return `<div class="m${isLive ? " live" : ""}${mine ? " me" : ""}">${side(m, m.a)}<span class="vs">ضد</span>${side(m, m.b)}</div>`;
      }).join("");
      return `<div class="rlbl">${stageName(cup.size >> k)}</div>${rows}`;
    }).join("");
    const liveCard = spectator ? `<section class="card livecard"><div class="muted">مباراة جارية: ${esc(s.match.label)}</div>
      <div class="nextm"><b style="--c:${nmOf(s.match.a).color}">${esc(nmOf(s.match.a).name)}</b><span class="vs">ضد</span><b style="--c:${nmOf(s.match.b).color}">${esc(nmOf(s.match.b).name)}</b></div>
      <button class="primary big" data-act="watch">مشاهدة</button></section>` : "";
    pScreen.innerHTML = `${connBar}<div class="pwrap">${head}
      ${v === "champion" ? `<div class="champwrap" style="min-height:auto;padding:14px 0"><img class="tro" src="img/trophy.webp" alt="" style="height:min(34dvh,300px)"><div class="plate"><span>${fin.w ? esc(nmOf(fin.w).name) : "بدون بطل"}</span></div></div>` : ""}
      <p class="cupinfo" style="font-size:1.05rem;color:#fff">${status}</p>
      ${liveCard}
      ${s.result && s.result.match && v === "bracket" ? `<p class="cupinfo">${esc(cupResultText(s.result, cup))}</p>` : ""}
      <div class="pbr" data-act="bigbr">${bracketHTML(cup)}</div>
      <p class="cupinfo" style="margin-top:2px">اضغط على الشجرة لتكبيرها</p>
      <section class="card mlist" style="margin-top:8px">${list}</section></div>`;
    const big = document.getElementById("bigbr"); if(big) big.querySelector(".bigin").innerHTML = bracketHTML(cup);
    return;
  }
  // play
  if(pLayout !== "play"){
    pLayout = "play"; lastSec = -1; lastPaint = "";
    app.innerHTML = `<div id="connbar"></div><div class="pwrap"><div id="phead"></div><div class="pq" id="pq"></div><div id="pban"></div>
      <div class="pturn" id="pturn"></div><div class="tbar"><i id="tbar"></i></div><div class="board" id="board"></div><div class="last" id="last"></div></div>`;
  }
  $("#connbar").innerHTML = connBar; $("#phead").innerHTML = head; $("#pq").textContent = s.question;
  const t = s.players.find(p => p.id === s.turn), mine = s.turn === P.pid && !s.paused;
  const nmOf = id => (s.players.find(p => p.id === id) || {}).name || "";
  const ban = spectator ? `<div class="banner watch row" style="justify-content:space-between"><span>${esc(s.match.label)}: ${esc(nmOf(s.match.a))} ضد ${esc(nmOf(s.match.b))}</span><button class="ghost" data-act="unwatch">خروج</button></div>`
    : me.alive ? "" : `<div class="banner">طلعت من هذي الجولة، تابع اللعب لين الجولة الجاية</div>`;
  if($("#pban").innerHTML !== ban) $("#pban").innerHTML = ban;
  const pt = $("#pturn"); pt.className = "pturn" + (mine ? " mine" : "");
  pt.innerHTML = s.paused ? `<span class="paused">اللعبة متوقفة</span><div class="clock"><span id="tnum"></span></div>`
    : mine ? `<div class="who">دورك! اختر الحرف</div><div class="clock"><span id="tnum"></span></div>`
    : t ? `<div class="who" style="--c:${t.color}"><span class="dot"></span>الدور على <b>${esc(t.name)}</b></div><div class="clock"><span id="tnum"></span></div>` : "";
  setClock(s.remaining, s.paused);
  const live = mine && me.alive && !P.pending;
  const b = $("#board"); b.className = "board " + (live ? "live" : "idle");
  b.innerHTML = boardHTML(s.letters, {just:P.justLetter}); P.justLetter = null;
  const last = $("#last"); last.textContent = s.last ? s.last.txt : ""; last.className = "last" + (s.last && s.last.out ? " out" : "");
}
function playerAct(act, el){
  if(act === "watch"){ P.watching = true; return renderPlayer(); }
  if(act === "unwatch"){ P.watching = false; return renderPlayer(); }
  if(act === "bigbr"){
    if(!P.s || !P.s.cup || document.getElementById("bigbr")) return;
    const o = document.createElement("div"); o.id = "bigbr"; o.className = "bigbr";
    o.innerHTML = `<button class="ghost closebr" data-act="closebr">إغلاق</button><div class="bigin">${bracketHTML(P.s.cup)}</div>`;
    document.body.append(o);
    // wide brackets (8+ players) read better turned sideways on a portrait phone
    if(parseFloat(o.querySelector(".bracket").style.getPropertyValue("--ar")) > 1.3) o.classList.add("rot");
    return;
  }
  if(act === "closebr"){ document.getElementById("bigbr")?.remove(); return; }
  if(act !== "letter") return;
  const s = P.s, l = el.dataset.l;
  if(!s || s.phase !== "play" || s.paused || s.turn !== P.pid || s.letters[l] || P.pending || !(P.conn && P.conn.open)) return;
  P.pending = l; P.conn.send({t:"pick", l});
  el.classList.add("used"); $("#board").className = "board idle";
  setTimeout(() => { if(P.pending === l){ P.pending = null; renderPlayer(); } }, 3000);
}

/* =====================================================================
   routing + events
   ===================================================================== */
const hashCode = location.hash.slice(1).toUpperCase();
const CODE_RE = /^[A-HJ-NP-Z]{4}$/; // same alphabet as newCode(): no I or O, so "#host" never matches
const isPlayerMode = CODE_RE.test(hashCode);

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act === "gohost"){ location.hash = "host"; return location.reload(); }
  if(isPlayerMode) playerAct(act, el); else if(S) hostAct(act, el);
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if(f.id === "joinForm"){
    const name = $("#nameIn").value.trim().slice(0, 16); if(!name){ $("#nameIn").focus(); return; }
    P.name = name; localStorage.setItem("huroof_name", name); P.view = "wait"; renderPlayer(); pConnect(); keepAwake();
  } else if(f.id === "codeForm"){
    const c = $("#codeIn").value.trim().toUpperCase();
    if(!CODE_RE.test(c)) return toast("تأكد من رمز الغرفة");
    location.hash = c; location.reload();
  } else if(S) hostSubmit(f);
});

function landing(){
  app.innerHTML = `<div class="center"><div class="brand">حروف</div>
    <p class="muted">لعبة جماعية: سؤال، 28 حرف، و15 ثانية لكل لاعب.</p>
    <div class="card">
      <button class="primary big" data-act="gohost">افتح غرفة (هوست)</button>
      <div class="or">أو ادخل غرفة موجودة</div>
      <form id="codeForm" class="row"><input class="inp codein" id="codeIn" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off"><button class="ghost">انضم</button></form>
    </div></div>`;
}

if(isPlayerMode) playerStart(hashCode);
else if(location.hash === "#host" || localStorage.getItem("huroof_host")) hostStart();
else landing();
</script>
